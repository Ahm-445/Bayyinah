# Render Blueprint for Bayyinah. Services created by hand in the dashboard do
# not read this file; it documents the settings they need (see README).
services:
  - type: web
    name: bayyinah
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://bayyinah-frontend.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: bayyinah
      - key: JWT_SECRET
        generateValue: true
      - key: VOYAGE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: bayyinah-frontend
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_API_BASE_URL
        value: https://bayyinah-eteb.onrender.com/api
    # SPA fallback: /login, /questions/... must serve index.html.
    # (Render static sites ignore public/_redirects.)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
